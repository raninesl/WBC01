<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>WBC AI Assistant – Métavers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="logo wess.png" />
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="utils.js"></script>
</head>
<body>
    <!-- Background 3D -->
    <div id="scene-3d">
        <div class="parallax-layer grid-floor grid-layer"></div>
    </div>

    <!-- Main Layout -->
    <div class="chat-layout">
        <!-- Sidebar (AI Core Visualization & Actions) -->
        <aside class="glass-panel chat-sidebar">
            <div class="ai-avatar-container">
                <div class="ai-core"></div>
            </div>
            <div class="ai-status">
                <h2>WBC AI</h2>
                <p id="assistant-status">En ligne</p>
            </div>
            
            <div class="quick-actions">
                <button class="action-btn assistant-btn" data-prompt="Mon planning">
                    <i class="fa-solid fa-calendar"></i> Mon planning
                </button>
                <button class="action-btn assistant-btn" data-prompt="Mes notes">
                    <i class="fa-solid fa-graduation-cap"></i> Mes notes
                </button>
                <button class="action-btn assistant-btn" data-prompt="Infos campus">
                    <i class="fa-solid fa-map-location-dot"></i> Infos campus
                </button>
                <button id="open-history-btn" class="action-btn" style="background: rgba(189, 0, 255, 0.1); border-color: rgba(189, 0, 255, 0.3); color: #bd00ff;">
                    <i class="fa-solid fa-clock-rotate-left"></i> Mon historique
                </button>
            </div>

            <div class="sidebar-footer">
                <button class="action-btn" onclick="window.history.back()">
                    <i class="fa-solid fa-arrow-left"></i> Retour
                </button>
            </div>
        </aside>

        <!-- Main Chat Interface -->
        <main class="glass-panel chat-main">
            <header class="chat-header">
                <div class="chat-header-title">
                    <img src="logo wess.png" alt="AI Logo">
                    <span>ASSISTANT INTELLIGENT</span>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button id="chat-back-btn" class="action-btn" title="Retour" style="padding: 8px; width: 36px; height: 36px; justify-content: center;">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <button id="new-chat-btn" class="action-btn" title="Nouvelle conversation" style="padding: 8px; width: auto; height: 36px; background: rgba(0, 255, 136, 0.1); border-color: rgba(0, 255, 136, 0.3); color: #00ff88;">
                        <i class="fa-solid fa-plus"></i> <span style="font-size: 0.8rem; margin-left: 5px;">Nouveau</span>
                    </button>
                    <button id="delete-chat-btn" class="action-btn" title="Supprimer l'historique" style="padding: 8px; width: 36px; height: 36px; justify-content: center; background: rgba(255, 68, 68, 0.1); border-color: rgba(255, 68, 68, 0.3); color: #ff4444;">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                    <div id="assistant-user-avatar" style="width: 32px; height: 32px; border-radius: 50%; background-size: cover; background-position: center; border: 1px solid rgba(255,255,255,0.2);"></div>
                    <span id="assistant-user-info" style="font-size: 0.85rem; color: var(--text-muted);"></span>
                    <button id="chat-refresh" class="action-btn" title="Rafraîchir" style="padding: 8px; width: 36px; height: 36px; justify-content: center;">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </header>

            <div id="chat-messages" class="chat-messages">
                <!-- Messages will be injected here via JS -->
            </div>

            <!-- Typing Indicator -->
            <div id="typing-indicator" class="typing-dots" style="display: none;">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="chat-input-area">
                <div class="input-wrapper">
                    <input type="text" id="chat-input" class="chat-input" placeholder="Pose ta question à l'IA du campus..." autocomplete="off">
                </div>
                <button id="chat-send" class="send-btn">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- History Modal -->
    <div id="history-modal-backdrop" class="modal-backdrop" hidden>
        <div class="glass-panel modal-content" style="max-width: 900px; width: 98%; max-height: 88vh; display: flex; flex-direction: column;">
            <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);">
                <h3 style="margin: 0; color: #bd00ff;"><i class="fa-solid fa-clock-rotate-left"></i> Historique des conversations</h3>
                <button id="close-history-btn" class="btn-icon" title="Fermer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="history-list" style="flex: 1; overflow-y: auto; padding: 18px 10px;">
                <!-- History items will be injected here -->
                <div style="text-align: center; opacity: 0.5; padding: 20px;">Chargement de l'historique...</div>
            </div>
        </div>
    </div>

    <script src="ai-assistant.js"></script>
    <script src="3d-bg.js"></script>
</body>
</html>
