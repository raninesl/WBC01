<!DOCTYPE html>
<html lang="fr" style="overflow: hidden; height: 100%;">
<head>
  <meta charset="UTF-8" />
  <title>Connexion – Wess Business City</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="style.css?v=2" />
  <link rel="stylesheet" href="transitions.css?v=2" />
  <link rel="icon" type="image/png" href="logo wess.png" />
</head>
<body>
  <!-- Background 3D animé (Restored) -->
  <div id="scene-3d">
    <div class="parallax-layer skyline-layer">
      <div class="skyline"></div>
      <div class="skyline-glow"></div>
    </div>
    <div class="parallax-layer grid-layer">
      <div class="grid-floor"></div>
    </div>
    <div class="parallax-layer orbs-layer">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
    </div>
    <div class="parallax-layer particles-layer">
      <div class="particles"></div>
    </div>
  </div>

  <div class="main-container">
    <div class="login-container">
      <div class="login-header">
        <div class="logo-wrapper">
          <img src="logo wess.png" alt="Logo Wes'sup" class="app-logo" />
        </div>
        <h1 class="app-title">Wess Business City</h1>
        <div class="app-subtitle">Campus 3D</div>
      </div>

      <form class="login-form" id="login-form">
        <div class="input-group">
          <label for="email">Identifiant</label>
          <input type="email" id="email" placeholder="etu@wessup.local" required />
        </div>
        
        <div class="input-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        
        <div class="login-error" id="login-error"></div>
        
        <button type="submit" class="btn-primary" id="login-btn">Se connecter</button>
      </form>
      
      <footer class="login-footer">
        <a href="#" class="footer-link">Mot de passe oublié ?</a>
      </footer>
    </div>
  </div>

  <script src="transitions.js"></script>
  <script src="login.js"></script>
  <script src="3d-bg.js"></script>
</body>
</html>
